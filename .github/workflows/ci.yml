name: Vertex Static CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Validate auth JavaScript syntax
        run: node --check auth.js
      - name: Validate account and owner JavaScript syntax
        run: node --check account.js && node --check owner.js

      - name: Validate required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f vercel.json
          test -f signin.html
          test -f signup.html
          test -f auth.js
          test -f auth.css
          test -f account.html
          test -f account.css
          test -f account.js
          test -f owner.html
          test -f owner.js
          test -d supabase/migrations
          ! grep -q '"framework"[[:space:]]*:[[:space:]]*"nextjs"' vercel.json
          ! grep -q '"next"' index.html

      - name: Verify static entrypoint
        run: grep -q '<script src="./app.js"></script>' index.html

      - name: Verify Vertex-only frontend schema references
        run: |
          ! grep -R -n -E '(^|[^A-Za-z])(premium_[A-Za-z0-9_]*|ai_(conversations|messages|request_windows)|chat_(conversations|messages|participants)|user_profiles)([^A-Za-z]|$)'             app.js index.html styles.css 2>/dev/null
