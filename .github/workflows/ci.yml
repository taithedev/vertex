name: Vertex Static CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate required static files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f vercel.json
          ! grep -q '"framework"[[:space:]]*:[[:space:]]*"nextjs"' vercel.json
          ! grep -q '"next"' index.html

      - name: Verify static entrypoint
        run: grep -q '<script src="./app.js"></script>' index.html
