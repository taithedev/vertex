name: Vertex Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and publish Windows desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Vertex Desktop __VERSION__
          releaseBody: Automated Vertex desktop release.
          releaseDraft: true
          prerelease: true
